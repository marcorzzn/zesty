<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3dad" />
      <stop offset="50%" stop-color="#e0289a" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Sfondo Icona Arrotondato Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="232" rx="112" fill="url(#glowGrad)" />

  <!-- Logo Zesty "P" stilizzato -->
  <g transform="translate(106, 86)">
    <!-- Asta Verticale -->
    <rect x="30" y="30" width="60" height="280" rx="30" fill="#ffffff" />
    <!-- Cerchio Superiore del P -->
    <path d="M 90,30 L 170,30 C 230,30 270,70 270,130 C 270,190 230,230 170,230 L 90,230 Z" fill="#ffffff" />
    <!-- Buco interno sfumato -->
    <circle cx="165" cy="130" r="42" fill="url(#bgGrad)" />
  </g>
</svg>

