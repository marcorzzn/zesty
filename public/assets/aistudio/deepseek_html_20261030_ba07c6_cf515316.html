<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>Picsart Clone</title>
<style>
:root{
  --bg:#000;--panel:#0d0d10;--panel2:#16161a;--panel3:#1c1c22;
  --border:#26262e;--text:#fff;--dim:#9a9aa5;--mute:#5c5c66;
  --accent:#e0289a;--accent-hi:#ff3dad;--active:#8b5cf6;
  --pro:#ff5c8a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,'Inter','Segoe UI',sans-serif;font-size:13px;color:var(--text);background:#000;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
svg{display:block;flex-shrink:0}

#app{
  position:relative;width:100vw;height:100dvh;display:flex;flex-direction:column;
  overflow:hidden;background:#000;
}

/* ============ TOP BAR ============ */
.topbar{
  position:relative;z-index:40;
  display:flex;align-items:center;gap:6px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  background:transparent;
}
.topbar-group{display:flex;gap:4px}
.tb-icon{
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:50%;color:#fff;transition:background .15s,transform .1s;
}
.tb-icon:active{transform:scale(0.92);background:rgba(255,255,255,0.15)}
.tb-icon svg{width:18px;height:18px}
.tb-sep{flex:1}
.tb-icon.check{background:var(--accent);color:#fff}
.tb-icon.check:active{background:var(--accent-hi)}
.res-badge{
  padding:6px 12px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);
  border-radius:18px;font-size:11px;font-weight:500;color:#fff;white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
.layers-fab{
  position:absolute;top:calc(60px + env(safe-area-inset-top));right:12px;z-index:35;
  width:36px;height:36px;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
}
.layers-fab svg{width:16px;height:16px}
.layers-fab:active{transform:scale(0.92)}

/* ============ CANVAS AREA ============ */
.canvas-area{
  position:relative;flex:1;overflow:hidden;background:#000;
  display:flex;align-items:center;justify-content:center;
}
.stage{
  position:relative;display:block;
  box-shadow:0 4px 40px rgba(0,0,0,0.7);
  touch-action:none;
  max-width:100%;max-height:100%;
}
#canvas,#overlay{display:block;max-width:100%;max-height:100%;object-fit:contain}
#overlay{position:absolute;inset:0;pointer-events:none}

/* ============ BOTTOM TOOLBAR ============ */
.bottom-toolbar{
  position:relative;z-index:30;
  display:flex;align-items:center;gap:2px;
  padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  background:#000;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  transition:opacity .2s,transform .2s;
}
.bottom-toolbar::-webkit-scrollbar{display:none}
.bottom-toolbar.hidden{display:none}
.btool{
  flex-shrink:0;
  min-width:64px;
  padding:6px 8px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  border-radius:10px;
  color:var(--dim);
  position:relative;
  transition:background .15s,color .15s;
}
.btool:active{background:rgba(255,255,255,0.06)}
.btool.active{color:var(--active)}
.btool svg{width:22px;height:22px}
.btool-label{font-size:9px;font-weight:500;white-space:nowrap;letter-spacing:-0.01em}
.btool-pro{
  position:absolute;top:2px;right:8px;
  background:var(--accent);color:#fff;
  font-size:7px;font-weight:700;padding:1px 4px;border-radius:3px;letter-spacing:0.02em;
}

/* ============ FAB ============ */
.fab{
  position:absolute;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));
  width:48px;height:48px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;z-index:35;
  box-shadow:0 6px 20px rgba(224,40,154,0.4);
  transition:transform .15s,box-shadow .15s;
}
.fab:active{transform:scale(0.92)}
.fab svg{width:22px;height:22px}

/* ============ TOOL GRID POPUP ============ */
.tool-grid{
  position:absolute;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom));
  background:#0d0d10;
  border-top-left-radius:14px;border-top-right-radius:14px;
  padding:12px 8px;
  z-index:28;
  transform:translateY(calc(100% + 100px));
  transition:transform .28s cubic-bezier(0.32, 0.72, 0, 1);
  max-height:70vh;overflow-y:auto;
  scrollbar-width:none;
}
.tool-grid::-webkit-scrollbar{display:none}
.tool-grid.open{transform:translateY(0)}
.tool-grid-inner{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
}
.grid-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:10px 4px;border-radius:10px;
  color:var(--dim);
  transition:background .15s;
}
.grid-item:active{background:rgba(255,255,255,0.05)}
.grid-item svg{width:24px;height:24px}
.grid-item-label{font-size:9px;font-weight:500;text-align:center;line-height:1.15;letter-spacing:-0.01em}
.grid-item.ai{position:relative}
.grid-item.ai::after{
  content:'AI';position:absolute;top:6px;right:14px;
  background:var(--accent);color:#fff;font-size:6px;font-weight:700;
  padding:1px 3px;border-radius:2px;
}

/* ============ TOOL PANEL (when tool active) ============ */
.tool-panel{
  position:absolute;left:0;right:0;bottom:0;
  z-index:32;
  background:#000;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom:env(safe-area-inset-bottom);
}
.tool-panel.open{transform:translateY(0)}

/* --- shapes strip --- */
.shapes-strip{
  display:flex;gap:6px;padding:10px 12px;
  overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid #1a1a20;
  background:#000;
}
.shapes-strip::-webkit-scrollbar{display:none}
.shape-btn{
  flex-shrink:0;width:46px;height:46px;
  background:rgba(255,255,255,0.06);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  transition:background .15s;
}
.shape-btn.active{background:var(--active)}
.shape-btn svg{width:22px;height:22px}
.shape-btn:active{transform:scale(0.94)}

/* --- sub-options row --- */
.submenu{
  display:flex;gap:2px;padding:8px 6px;
  overflow-x:auto;scrollbar-width:none;
}
.submenu::-webkit-scrollbar{display:none}
.submenu-item{
  flex-shrink:0;min-width:62px;
  padding:6px 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--dim);
  border-radius:8px;
}
.submenu-item:active{background:rgba(255,255,255,0.05)}
.submenu-item.active{color:var(--accent-hi)}
.submenu-item svg{width:20px;height:20px}
.submenu-label{font-size:10px;font-weight:500;white-space:nowrap}

/* --- crop panel --- */
.crop-panel{
  display:flex;flex-direction:column;background:#000;
}
.rotate-slider-wrap{
  padding:14px 16px 6px;position:relative;
}
.rotate-badge{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:0 auto 8px;padding:5px 14px;background:rgba(255,255,255,0.08);
  border-radius:16px;font-size:12px;font-weight:500;
  font-variant-numeric:tabular-nums;max-width:120px;
}
.rotate-badge button{color:var(--dim)}
.rotate-badge svg{width:12px;height:12px}
.rotate-track{
  position:relative;height:44px;
  display:flex;align-items:center;
}
.rotate-track::before{
  content:'';position:absolute;left:0;right:0;top:50%;
  height:1px;background:#2a2a33;
}
.rotate-ticks{
  display:flex;justify-content:space-between;width:100%;
  font-size:9px;color:var(--mute);padding-bottom:22px;
  font-variant-numeric:tabular-nums;
}
.rotate-needle{
  position:absolute;top:6px;bottom:14px;left:50%;
  width:2px;background:var(--accent-hi);
  transform:translateX(-50%);
  border-radius:2px;
}
.rotate-needle::before,.rotate-needle::after{
  content:'';position:absolute;left:50%;transform:translateX(-50%);
  width:8px;height:8px;border-radius:50%;background:var(--accent-hi);
}
.rotate-needle::before{top:-4px}
.rotate-needle::after{bottom:-4px}

.ratio-row{
  display:flex;gap:4px;padding:8px 8px;
  overflow-x:auto;scrollbar-width:none;
}
.ratio-row::-webkit-scrollbar{display:none}
.ratio-btn{
  flex-shrink:0;min-width:52px;padding:8px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:rgba(255,255,255,0.04);
  border-radius:8px;color:var(--dim);
  font-size:10px;
  transition:background .15s;
}
.ratio-btn.active{background:var(--active);color:#fff}
.ratio-btn:active{transform:scale(0.95)}
.ratio-btn svg{width:16px;height:16px}
.ratio-icon{width:18px;height:14px;border:1.5px solid currentColor;border-radius:2px}

.crop-tabs{
  display:flex;gap:2px;padding:8px 8px;padding-bottom:max(8px, env(safe-area-inset-bottom));
  background:#0a0a0d;border-top:1px solid #1a1a20;
}
.crop-tab{
  flex:1;padding:10px;text-align:center;
  font-size:11px;font-weight:600;color:var(--mute);letter-spacing:0.03em;
  background:rgba(255,255,255,0.03);border-radius:6px;
  transition:background .15s,color .15s;
}
.crop-tab.active{background:#26262e;color:#fff}
.crop-tab:active{transform:scale(0.96)}

/* --- brush panel --- */
.brush-types{
  display:flex;gap:6px;padding:12px;
  overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid #1a1a20;
}
.brush-types::-webkit-scrollbar{display:none}
.brush-tile{
  flex-shrink:0;width:52px;height:52px;
  background:rgba(255,255,255,0.05);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  overflow:hidden;
}
.brush-tile.active{border:2px solid var(--accent)}
.brush-preview{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}

/* --- text panel --- */
.text-panel{background:#000}
.text-panel-body{padding:12px}
.text-input{
  width:100%;min-height:80px;
  background:#16161a;border:1px solid #26262e;
  border-radius:8px;padding:10px;
  color:#fff;font-size:14px;resize:none;outline:none;
  font-family:inherit;
}
.text-input:focus{border-color:var(--accent)}
.font-row{
  display:flex;gap:6px;margin-top:10px;
  overflow-x:auto;scrollbar-width:none;
}
.font-row::-webkit-scrollbar{display:none}
.font-chip{
  flex-shrink:0;padding:8px 14px;
  background:#16161a;border:1px solid #26262e;
  border-radius:20px;font-size:12px;color:var(--dim);
}
.font-chip.active{background:var(--active);border-color:var(--active);color:#fff}

/* ============ LAYERS PANEL ============ */
.layers-panel{
  position:absolute;top:0;right:0;bottom:0;
  width:220px;
  background:rgba(13,13,16,0.98);backdrop-filter:blur(30px);
  z-index:45;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(0.32, 0.72, 0, 1);
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;flex-direction:column;
}
.layers-panel.open{transform:translateX(0)}
.layers-header{
  padding:10px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #1a1a20;
  font-size:12px;font-weight:600;
}
.layers-add{
  width:28px;height:28px;background:rgba(255,255,255,0.06);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
}
.layers-add svg{width:14px;height:14px}
.layers-list{flex:1;overflow-y:auto;padding:6px}
.layer-row{
  display:flex;align-items:center;gap:8px;
  padding:8px;border-radius:8px;
  margin-bottom:2px;
}
.layer-row.active{background:rgba(139,92,246,0.15);box-shadow:inset 2px 0 0 var(--active)}
.layer-thumb{
  width:34px;height:34px;border-radius:4px;background:#000;border:1px solid #26262e;
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
}
.layer-info{flex:1;min-width:0}
.layer-name{font-size:11px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer-vis{
  width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  color:var(--dim);flex-shrink:0;
}
.layer-vis.on{color:#fff}
.layer-vis svg{width:14px;height:14px}

/* ============ TOAST ============ */
.toast{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.9);
  background:#fff;color:#000;
  padding:14px 18px;border-radius:12px;
  display:flex;flex-direction:column;gap:10px;
  max-width:320px;width:calc(100% - 60px);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:100;
}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.toast-content{display:flex;gap:12px;align-items:flex-start}
.toast-icon{
  width:36px;height:36px;background:#000;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.toast-icon svg{width:20px;height:20px}
.toast-msg{font-size:13px;font-weight:500;line-height:1.35;color:#000}
.toast-btn{
  align-self:flex-start;color:#8b5cf6;font-weight:600;font-size:13px;
  padding:4px 0;
}

/* ============ SLIDER (custom) ============ */
.slider-row{
  display:flex;align-items:center;gap:10px;padding:8px 14px;
}
.slider-row label{font-size:11px;color:var(--dim);min-width:60px}
.slider-row input[type=range]{
  flex:1;accent-color:var(--accent);
  height:3px;
}
.slider-row .val{
  font-size:11px;color:#fff;min-width:32px;text-align:right;
  font-variant-numeric:tabular-nums;
}

/* ============ ADJUST/TOOL EXTRAS ============ */
.tool-actions{
  display:flex;gap:6px;padding:10px 12px;padding-bottom:max(10px, env(safe-area-inset-bottom));
  border-top:1px solid #1a1a20;
}
.btn-primary{
  flex:1;padding:12px;background:var(--accent);color:#fff;
  border-radius:10px;font-weight:600;font-size:13px;
}
.btn-primary:active{background:var(--accent-hi)}
.btn-secondary{
  flex:1;padding:12px;background:rgba(255,255,255,0.08);color:#fff;
  border-radius:10px;font-weight:600;font-size:13px;
}

/* ============ SCREEN SHAKE ============ */
@media (max-height:640px){
  .tool-grid{max-height:60vh}
}
</style>
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header class="topbar" id="topbar">
    <button class="tb-icon" data-act="close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="topbar-group">
      <button class="tb-icon" data-act="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="tb-icon" data-act="redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <button class="tb-icon" data-act="more">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <button class="tb-icon" data-act="download">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="tb-icon" data-act="share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    </button>
  </header>

  <!-- TOP BAR (tool mode) -->
  <header class="topbar" id="topbarTool" style="display:none">
    <button class="tb-icon" id="tbBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <div class="topbar-group">
      <button class="tb-icon" data-act="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      </button>
      <button class="tb-icon" data-act="redo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
      </button>
      <button class="tb-icon" data-act="erase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16a2 2 0 0 1 0-2.83L13 3.17a2 2 0 0 1 2.83 0l5 5a2 2 0 0 1 0 2.83L11 20"/></svg>
      </button>
    </div>
    <div class="tb-sep"></div>
    <button class="tb-icon check" id="tbConfirm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
  </header>

  <!-- LAYERS FAB -->
  <button class="layers-fab" id="layersFab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
  </button>

  <!-- CANVAS -->
  <main class="canvas-area">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>
    </div>
  </main>

  <!-- TOOL GRID POPUP -->
  <div class="tool-grid" id="toolGrid">
    <div class="tool-grid-inner" id="toolGridInner"></div>
  </div>

  <!-- TOOL PANEL (replaces toolbar when tool active) -->
  <div class="tool-panel" id="toolPanel"></div>

  <!-- BOTTOM TOOLBAR -->
  <nav class="bottom-toolbar" id="bottomToolbar"></nav>

  <!-- FAB -->
  <button class="fab" id="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
  </button>

  <!-- LAYERS PANEL -->
  <aside class="layers-panel" id="layersPanel">
    <div class="layers-header">
      <span>Livelli</span>
      <button class="layers-add" id="layersAdd">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="layers-list" id="layersList"></div>
  </aside>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <div class="toast-content">
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
      </div>
      <div class="toast-msg" id="toastMsg">Messaggio</div>
    </div>
    <button class="toast-btn" id="toastBtn">Capito!</button>
  </div>

</div>

<script>
(() => {
'use strict';

const canvas = $('canvas');
const overlay = $('overlay');
const ctx = canvas.getContext('2d');
const ovCtx = overlay.getContext('2d');
const stage = $('stage');

function createDemoImage() {
  // Immagine demo 800x800 con cavallo stilizzato su sfondo a tessuto scuro
  canvas.width = 800; canvas.height = 800;
  overlay.width = 800; overlay.height = 800;

  // Sfondo scuro con gradiente radiale
  const grad = ctx.createRadialGradient(400, 400, 100, 400, 400, 600);
  grad.addColorStop(0, '#2a2a35');
  grad.addColorStop(1, '#050508');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 800, 800);

  // Texture "tessuto" - rumore sottile
  const imgData = ctx.getImageData(0, 0, 800, 800);
  for (let i = 0; i < imgData.data.length; i += 4) {
    const n = (Math.random() - 0.5) * 40;
    imgData.data[i] = clamp(imgData.data[i] + n, 0, 255);
    imgData.data[i+1] = clamp(imgData.data[i+1] + n, 0, 255);
    imgData.data[i+2] = clamp(imgData.data[i+2] + n, 0, 255);
  }
  ctx.putImageData(imgData, 0, 0);

  // Sfumatura diagonale per effetto tessuto
  const diagGrad = ctx.createLinearGradient(0, 0, 800, 800);
  diagGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
  diagGrad.addColorStop(0.5, 'rgba(255,255,255,0.03)');
  diagGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = diagGrad;
  ctx.fillRect(0, 0, 800, 800);

  // Cerchio/bordo scuro (outline)
  ctx.fillStyle = '#1a1a1f';
  ctx.beginPath();
  ctx.arc(400, 600, 140, 0, Math.PI * 2);
  ctx.fill();

  // Palla bianca
  ctx.fillStyle = '#f5f2ea';
  ctx.beginPath();
  ctx.arc(400, 600, 130, 0, Math.PI * 2);
  ctx.fill();

  // Linee della palla (stile pallone)
  ctx.strokeStyle = '#2a2a30';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.arc(400, 600, 130, 0, Math.PI * 2);
  ctx.stroke();
  // Cuciture
  ctx.beginPath();
  ctx.moveTo(400, 470); ctx.lineTo(400, 530);
  ctx.moveTo(340, 540); ctx.quadraticCurveTo(400, 590, 460, 540);
  ctx.moveTo(340, 660); ctx.quadraticCurveTo(400, 610, 460, 660);
  ctx.moveTo(270, 600); ctx.lineTo(340, 600);
  ctx.moveTo(460, 600); ctx.lineTo(530, 600);
  ctx.moveTo(320, 520); ctx.quadraticCurveTo(360, 570, 360, 630);
  ctx.moveTo(480, 520); ctx.quadraticCurveTo(440, 570, 440, 630);
  ctx.stroke();

  // Cavallo stilizzato (silhouette semplificata)
  ctx.fillStyle = '#f5f2ea';
  ctx.strokeStyle = '#1a1a1f';
  ctx.lineWidth = 8;
  ctx.lineJoin = 'round';
  ctx.beginPath();
  // Testa
  ctx.moveTo(430, 220);
  ctx.quadraticCurveTo(470, 200, 490, 230);  // orecchie
  ctx.quadraticCurveTo(500, 260, 480, 300);  // muso
  ctx.quadraticCurveTo(460, 320, 430, 320);  // guancia
  ctx.quadraticCurveTo(400, 300, 400, 280);  // collo alto
  // Criniera
  ctx.quadraticCurveTo(380, 260, 360, 240);
  ctx.quadraticCurveTo(390, 240, 410, 260);
  ctx.quadraticCurveTo(400, 220, 380, 200);
  // Testa posteriore
  ctx.quadraticCurveTo(420, 200, 440, 210);
  // Corpo posteriore
  ctx.quadraticCurveTo(380, 350, 350, 400);
  ctx.quadraticCurveTo(300, 420, 270, 460); // coda
  ctx.quadraticCurveTo(320, 450, 340, 470);
  // Zampa posteriore
  ctx.quadraticCurveTo(380, 500, 400, 500);
  // Pancia
  ctx.quadraticCurveTo(430, 490, 460, 460);
  // Zampa anteriore sollevata
  ctx.quadraticCurveTo(470, 420, 500, 400);
  ctx.quadraticCurveTo(510, 380, 500, 360);
  ctx.quadraticCurveTo(490, 380, 480, 400);
  // Zampa anteriore giù
  ctx.quadraticCurveTo(480, 450, 460, 500);
  // Chiudi al collo
  ctx.quadraticCurveTo(450, 400, 440, 340);
  ctx.quadraticCurveTo(445, 310, 445, 300);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  state.imageLoaded = true;
  state.layers = [{id:'base', name:'Immagine base', visible:true}];
  state.activeLayerId = 'base';
  refreshLayersList();
}

// ============ RENDERIZZAZIONE UI ============
function renderBottomToolbar() {
  const tb = $('bottomToolbar');
  tb.innerHTML = '';
  BOTTOM_TOOLS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'btool' + (i === 0 ? ' active' : '');
    btn.dataset.tool = t.id;
    btn.innerHTML = `
      ${t.pro ? '<span class="btool-pro">PRO</span>' : ''}
      ${ic(t.icon, 22)}
      <span class="btool-label">${t.label}</span>
    `;
    btn.addEventListener('click', () => handleBottomTool(t.id));
    tb.appendChild(btn);
  });
}

function renderToolGrid() {
  const gi = $('toolGridInner');
  gi.innerHTML = '';
  TOOL_GRID_ITEMS.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'grid-item' + (t.ai ? ' ai' : '');
    btn.innerHTML = `${ic(t.icon, 24)}<span class="grid-item-label">${t.label}</span>`;
    btn.addEventListener('click', () => {
      closeToolGrid();
      openTool(t.id);
    });
    gi.appendChild(btn);
  });
}

function refreshLayersList() {
  const list = $('layersList');
  if (!list) return;
  list.innerHTML = '';
  state.layers.forEach(l => {
    const row = document.createElement('div');
    row.className = 'layer-row' + (l.id === state.activeLayerId ? ' active' : '');
    row.innerHTML = `
      <div class="layer-thumb">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#666" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <div class="layer-info">
        <div class="layer-name">${l.name}</div>
      </div>
      <button class="layer-vis${l.visible ? ' on' : ''}" data-lid="${l.id}">
        ${ic(l.visible ? 'eye' : 'eyeoff', 14)}
      </button>
    `;
    row.addEventListener('click', e => {
      if (e.target.closest('.layer-vis')) return;
      state.activeLayerId = l.id;
      refreshLayersList();
    });
    const vis = row.querySelector('.layer-vis');
    vis.addEventListener('click', e => {
      e.stopPropagation();
      l.visible = !l.visible;
      refreshLayersList();
    });
    list.appendChild(row);
  });
}

// ============ TOOL HANDLERS ============
function handleBottomTool(id) {
  // Aggiorna highlight
  document.querySelectorAll('.btool').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.btool[data-tool="${id}"]`);
  if (btn) btn.classList.add('active');

  if (id === 'tools') {
    toggleToolGrid();
  } else if (['shapes','brush','crop','text','effects','adjust'].includes(id)) {
    openTool(id);
  } else {
    showToast('Strumento in fase di sviluppo', 'info');
  }
}

function toggleToolGrid() {
  const g = $('toolGrid');
  g.classList.toggle('open');
}
function closeToolGrid() {
  $('toolGrid').classList.remove('open');
}

function openTool(id) {
  state.currentTool = id;
  switch(id) {
    case 'crop': openCropTool(); break;
    case 'shapes': openShapesTool(); break;
    case 'brush': openBrushTool(); break;
    case 'text': openTextTool(); break;
    case 'effects': openEffectsTool(); break;
    case 'adjust': openAdjustTool(); break;
    default: showToast('Strumento ' + id + ' in sviluppo');
  }
}

function enterToolMode() {
  $('topbar').style.display = 'none';
  $('topbarTool').style.display = 'flex';
  $('bottomToolbar').classList.add('hidden');
  $('fab').style.display = 'none';
  $('layersFab').style.display = 'none';
}

function exitToolMode() {
  $('topbar').style.display = 'flex';
  $('topbarTool').style.display = 'none';
  $('bottomToolbar').classList.remove('hidden');
  $('fab').style.display = 'flex';
  $('layersFab').style.display = 'flex';
  const p = $('toolPanel');
  p.classList.remove('open');
  state.currentTool = null;
  // reset rotation overlay
  ovCtx.clearRect(0,0,overlay.width, overlay.height);
}

    const pct = ((v + 45) / 90) * 100;

  };

}

function drawCropOverlay() {
  ovCtx.clearRect(0, 0, overlay.width, overlay.height);
  // Disegna cornice di ritaglio con rotazione
  const pad = 80;
  const size = Math.min(overlay.width, overlay.height) - pad * 2;
  const cx = overlay.width / 2, cy = overlay.height / 2;

  ovCtx.save();
  ovCtx.translate(cx, cy);
  ovCtx.rotate(state.rotation * Math.PI / 180);
  ovCtx.translate(-cx, -cy);

  // Sfondo scuro fuori dalla cornice
  ovCtx.fillStyle = 'rgba(0,0,0,0.55)';
  ovCtx.fillRect(0, 0, overlay.width, overlay.height);
  // Buco
  ovCtx.globalCompositeOperation = 'destination-out';
  ovCtx.fillStyle = '#fff';
  ovCtx.fillRect(cx - size/2, cy - size/2, size, size);
  ovCtx.globalCompositeOperation = 'source-over';

  // Bordo cornice
  ovCtx.strokeStyle = '#fff';
  ovCtx.lineWidth = 2;
  ovCtx.strokeRect(cx - size/2, cy - size/2, size, size);

  // Griglia terzi
  ovCtx.strokeStyle = 'rgba(255,255,255,0.35)';
  ovCtx.lineWidth = 1;
  for (let i = 1; i < 3; i++) {
    const p = i / 3;
    ovCtx.beginPath();
    ovCtx.moveTo(cx - size/2 + size*p, cy - size/2);
    ovCtx.lineTo(cx - size/2 + size*p, cy + size/2);
    ovCtx.stroke();
    ovCtx.beginPath();
    ovCtx.moveTo(cx - size/2, cy - size/2 + size*p);
    ovCtx.lineTo(cx + size/2, cy - size/2 + size*p);
    ovCtx.stroke();
  }

  // Maniglie angoli
  ovCtx.fillStyle = '#fff';
  ovCtx.strokeStyle = '#8b5cf6';
  ovCtx.lineWidth = 2;
  const hs = 10;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([dx,dy]) => {
    const x = cx + dx*size/2;
    const y = cy + dy*size/2;
    ovCtx.beginPath();
    ovCtx.arc(x, y, hs/2, 0, Math.PI*2);
    ovCtx.fill();
    ovCtx.stroke();
  });
  ovCtx.restore();
}

function drawShapeDemo(shape) {
  ovCtx.clearRect(0, 0, overlay.width, overlay.height);
  const cx = overlay.width / 2, cy = overlay.height / 2;
  const size = 200;

  ovCtx.save();
  ovCtx.translate(cx, cy);
  ovCtx.fillStyle = '#8b5cf6';
  ovCtx.strokeStyle = '#fff';
  ovCtx.lineWidth = 3;

  switch(shape) {
    case 'circle':
      ovCtx.beginPath();
      ovCtx.arc(0, 0, size/2, 0, Math.PI*2);
      ovCtx.fill(); ovCtx.stroke();
      break;
    case 'square':
      ovCtx.beginPath();
      ovCtx.roundRect(-size/2, -size/2, size, size, 8);
      ovCtx.fill(); ovCtx.stroke();
      break;
    case 'tri':
    case 'triangle':
      ovCtx.beginPath();
      ovCtx.moveTo(0, -size/2);
      ovCtx.lineTo(size/2, size/2);
      ovCtx.lineTo(-size/2, size/2);
      ovCtx.closePath();
      ovCtx.fill(); ovCtx.stroke();
      break;
    case 'heart':
      ovCtx.beginPath();
      const s = size / 2;
      ovCtx.moveTo(0, s*0.7);
      ovCtx.bezierCurveTo(-s*1.2, -s*0.3, -s*0.4, -s*1.1, 0, -s*0.4);
      ovCtx.bezierCurveTo(s*0.4, -s*1.1, s*1.2, -s*0.3, 0, s*0.7);
      ovCtx.fill(); ovCtx.stroke();
      break;
    case 'star':
      ovCtx.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = (i / 10) * Math.PI*2 - Math.PI/2;
        const r = i % 2 === 0 ? size/2 : size/4;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        i === 0 ? ovCtx.moveTo(x, y) : ovCtx.lineTo(x, y);
      }
      ovCtx.closePath();
      ovCtx.fill(); ovCtx.stroke();
      break;
    case 'pentagon':
      ovCtx.beginPath();
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI*2 - Math.PI/2;
        const x = Math.cos(angle) * size/2;
        const y = Math.sin(angle) * size/2;
        i === 0 ? ovCtx.moveTo(x, y) : ovCtx.lineTo(x, y);
      }
      ovCtx.closePath();
      ovCtx.fill(); ovCtx.stroke();
      break;
  }
  ovCtx.restore();
}

// ============ RESIZE HANDLING ============
function updateStageSize() {
  const area = document.querySelector('.canvas-area');
  const rect = area.getBoundingClientRect();
  const maxW = rect.width - 20;
  const maxH = rect.height - 20;
  const ratio = canvas.width / canvas.height;
  let w = maxW, h = maxW / ratio;
  if (h > maxH) { h = maxH; w = maxH * ratio; }
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
}

window.addEventListener('resize', updateStageSize);
