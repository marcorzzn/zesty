<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zesty">
  
  <title>Zesty</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 36px rgba(255, 140, 40, 0.35); }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ff8c28;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="splash">
    <img class="logo-img" src="assets/icons/icon-192.png" alt="Zesty" width="96" height="96">
    <div class="app-title">Zesty</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Registrazione Service Worker per installazione PWA e funzionamento offline
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('ServiceWorker fallback offline:', err);
        });
      });
    }

    // Redirect immediato all'editor core
    setTimeout(() => {
      location.replace('assets/aistudio/deepseek_html_20261030_ba07c6_cf515316.html');
    }, 150);
  </script>
</body>
</html>
