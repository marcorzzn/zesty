<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Picsart">
  
  <title>Picsart Studio</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
    }
    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-wrap {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ff3dad, #e0289a, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 36px rgba(224, 40, 154, 0.45);
    }
    .logo-wrap svg {
      width: 48px;
      height: 48px;
      fill: #fff;
    }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #e0289a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
    </div>
    <div class="app-title">Picsart Studio</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Registrazione Service Worker per installazione PWA e funzionamento offline
    if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.warn('ServiceWorker fallback offline:', err);
        });
      });
    }

    // Redirect immediato all'editor core
    setTimeout(() => {
      location.replace('assets/aistudio/deepseek_html_20261030_ba07c6_cf515316.html');
    }, 150);
  </script>
</body>
</html>
